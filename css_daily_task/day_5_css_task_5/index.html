<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated CSS Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Animated Gallery</h1>
        <p>Explore the beauty of nature</p>
    </header>

    <main class="gallery">

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Mountain">
            <div class="overlay">
                <h2>Mountain</h2>
                <p>Beautiful mountain landscape</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7" alt="Forest">
            <div class="overlay">
                <h2>Forest</h2>
                <p>Peaceful green forest</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Beach">
            <div class="overlay">
                <h2>Beach</h2>
                <p>Relaxing ocean view</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8" alt="Sunset">
            <div class="overlay">
                <h2>Sunset</h2>
                <p>Beautiful evening sky</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e" alt="Trees">
            <div class="overlay">
                <h2>Nature</h2>
                <p>Fresh green trees</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e" alt="Landscape">
            <div class="overlay">
                <h2>Landscape</h2>
                <p>Amazing natural scenery</p>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 Animated Gallery</p>
    </footer>

</body>
</html>
